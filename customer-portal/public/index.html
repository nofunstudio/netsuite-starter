<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Portal - Marabou Midstream Services</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        .header h1 {
            color: #667eea;
            font-size: 36px;
            margin-bottom: 8px;
        }
        
        .header p {
            color: #6c757d;
            font-size: 16px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
        }
        
        .stat-card h3 {
            font-size: 42px;
            color: #667eea;
            margin-bottom: 8px;
        }
        
        .stat-card p {
            color: #6c757d;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .projects-container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }
        
        .project-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 12px;
            padding: 25px;
            border-left: 5px solid #667eea;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }
        
        .project-card h3 {
            color: #212529;
            font-size: 20px;
            margin-bottom: 15px;
        }
        
        .project-card .project-id {
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            display: inline-block;
            background: white;
            padding: 4px 12px;
            border-radius: 12px;
        }
        
        .project-info {
            margin-bottom: 10px;
            color: #495057;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        
        .project-info strong {
            min-width: 100px;
            color: #212529;
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 15px;
        }
        
        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .no-data h2 {
            margin-bottom: 12px;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }
        
        .refresh-btn:hover {
            background: #5568d3;
        }
        
        .search-box {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Project Portal</h1>
            <p>Real-time visibility into your projects</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <h3 id="totalProjects">-</h3>
                <p>Total Projects</p>
            </div>
            <div class="stat-card">
                <h3 id="activeProjects">-</h3>
                <p>Active Projects</p>
            </div>
            <div class="stat-card">
                <h3 id="completedProjects">-</h3>
                <p>Completed</p>
            </div>
        </div>
        
        <div class="projects-container">
            <h2 style="margin-bottom: 20px; color: #212529;">Your Projects</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search projects..." onkeyup="filterProjects()">
                <button class="refresh-btn" onclick="loadProjects()">🔄 Refresh</button>
            </div>
            
            <div id="projectsContent">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <h3>Loading your projects...</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allProjects = [];

        // Load projects on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadProjects();
        });

        async function loadProjects() {
            const container = document.getElementById('projectsContent');
            container.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <h3>Loading your projects...</h3>
                </div>
            `;

            try {
                const response = await fetch('/api/projects');
                const data = await response.json();

                if (data.success) {
                    allProjects = data.projects;
                    displayProjects(allProjects);
                    updateStats(allProjects);
                } else {
                    throw new Error(data.error || 'Failed to load projects');
                }
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `
                    <div class="error">
                        <h3>⚠️ Error Loading Projects</h3>
                        <p>${error.message}</p>
                        <p style="margin-top: 10px; font-size: 12px;">
                            Make sure your server is running and the NetSuite RESTlet is configured correctly.
                        </p>
                    </div>
                `;
            }
        }

        function displayProjects(projects) {
            const container = document.getElementById('projectsContent');

            if (projects.length === 0) {
                container.innerHTML = `
                    <div class="no-data">
                        <h2>No Projects Found</h2>
                        <p>There are no projects available at this time.</p>
                    </div>
                `;
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'project-grid';

            projects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="project-id">${project.projectId || project.id}</div>
                    <h3>${project.projectName || project.name || 'Untitled Project'}</h3>
                    
                    ${project.customerName ? `
                        <div class="project-info">
                            <strong>Customer:</strong>
                            <span>${project.customerName}</span>
                        </div>
                    ` : ''}
                    
                    ${project.startDate ? `
                        <div class="project-info">
                            <strong>Start Date:</strong>
                            <span>${formatDate(project.startDate)}</span>
                        </div>
                    ` : ''}
                    
                    ${project.endDate ? `
                        <div class="project-info">
                            <strong>End Date:</strong>
                            <span>${formatDate(project.endDate)}</span>
                        </div>
                    ` : ''}
                    
                    ${project.status ? `
                        <span class="status-badge">${project.status}</span>
                    ` : ''}
                `;
                grid.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(grid);
        }

        function updateStats(projects) {
            document.getElementById('totalProjects').textContent = projects.length;
            document.getElementById('activeProjects').textContent = 
                projects.filter(p => p.status && p.status.toLowerCase().includes('progress')).length;
            document.getElementById('completedProjects').textContent = 
                projects.filter(p => p.status && p.status.toLowerCase().includes('complete')).length;
        }

        function filterProjects() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProjects.filter(project => {
                return (
                    (project.projectName && project.projectName.toLowerCase().includes(searchTerm)) ||
                    (project.projectId && project.projectId.toLowerCase().includes(searchTerm)) ||
                    (project.customerName && project.customerName.toLowerCase().includes(searchTerm)) ||
                    (project.status && project.status.toLowerCase().includes(searchTerm))
                );
            });
            displayProjects(filtered);
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }
    </script>
</body>
</html>
